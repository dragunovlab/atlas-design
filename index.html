<!DOCTYPE html>
<html lang="ru">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Systeme Electric - Премиальные электроустановочные изделия европейского качества">

    <!-- Favicon -->

                                <i class="fa-solid fa-phone-volume" aria-hidden="true"></i>
                                <div class="icon-glow"></div>

                            </div>
                        </a>
                        <a href="mailto:info@systeme-electric.kz" class="contact-link" data-tooltip="Написать" aria-label="Отправить email">
                            <div class="contact-icon">
                                <i class="fa-solid fa-envelope-open" aria-hidden="true"></i>
                                <div class="icon-glow"></div>
                            </div>
                            <div class="contact-info">

                            </div>

                    </div>

                    <div class="social-group" role="group" aria-label="Социальные сети">

                        <a href="https://www.instagram.com/systeme.electric" class="social-link" target="_blank" rel="noopener" aria-label="Instagram">

                        <a href="#" class="social-link" target="_blank" rel="noopener" aria-label="Facebook">

                            <a class="nav-link" href="#switches-alt" aria-label="Перейти к разделу Переключатели">

                                <div class="nav-link-content">
                                    <span class="nav-icon">

                                        <div class="icon-glow"></div>
                                    </span>
                                    <span class="nav-text">Рамки</span>

                        </li>
                        <li class="nav-item" data-fade>

                                <div class="nav-link-content">

                                <span class="btn-icon">

                            </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
